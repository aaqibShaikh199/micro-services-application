apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: robot
resources:
  - servicemonitor.yaml
  - prometheus-rules.yaml
configMapGenerator:
  - name: robot-grafana-dashboard
    files:
      - robot-lab.json=grafana-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Robot
