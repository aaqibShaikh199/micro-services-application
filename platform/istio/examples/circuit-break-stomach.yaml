# Tight connection limits for the diamond. This replaces the stomach DestinationRule.
# Restore it with: kubectl apply -k platform/istio
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: stomach
  namespace: robot
spec:
  host: stomach.robot.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  subsets:
    - name: v1
      labels:
        version: v1
