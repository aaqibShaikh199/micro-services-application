# Canary for the legs service.
# Apply the Deployment first, wait until it is Ready, then the routing objects
# are in this same file so one apply does both. For a real release, point
# legs-v2 at a second image tag such as robot-legs:1.1.0.
# Restore the base routes with: kubectl apply -k platform/istio
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legs-v2
  namespace: robot
  labels:
    app.kubernetes.io/name: legs
    app.kubernetes.io/part-of: robot
    app.kubernetes.io/version: "1.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legs
      version: v2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legs
        app.kubernetes.io/part-of: robot
        app.kubernetes.io/version: "1.1.0"
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3001"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: legs
          image: robot-legs:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: ROBOT_TRACK
              value: "v2"
            - name: REQUIRE_ENERGY
              value: "true"
            - name: STOMACH_URL
              value: "http://stomach:3003"
            - name: LEGS_URL
              value: "http://legs:3001"
            - name: HANDS_URL
              value: "http://hands:3002"
            - name: EYES_URL
              value: "http://eyes:3004"
            - name: HEAD_URL
              value: "http://head:3005"
            - name: PUBLIC_LEGS_URL
              value: "http://legs.robot.local"
            - name: PUBLIC_HANDS_URL
              value: "http://hands.robot.local"
            - name: PUBLIC_STOMACH_URL
              value: "http://stomach.robot.local"
            - name: PUBLIC_EYES_URL
              value: "http://eyes.robot.local"
            - name: PUBLIC_HEAD_URL
              value: "http://head.robot.local"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: legs
  namespace: robot
spec:
  host: legs.robot.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 30
      http:
        http1MaxPendingRequests: 20
        maxRequestsPerConnection: 10
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: legs
  namespace: robot
spec:
  hosts:
    - legs.robot.local
    - legs
    - legs.robot.svc.cluster.local
  gateways:
    - robot-gateway
    - mesh
  http:
    - name: safe-retries
      match:
        - method:
            exact: GET
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: legs.robot.svc.cluster.local
            port:
              number: 3001
            subset: v1
          weight: 90
        - destination:
            host: legs.robot.svc.cluster.local
            port:
              number: 3001
            subset: v2
          weight: 10
    - name: mutations
      timeout: 3s
      route:
        - destination:
            host: legs.robot.svc.cluster.local
            port:
              number: 3001
            subset: v1
          weight: 90
        - destination:
            host: legs.robot.svc.cluster.local
            port:
              number: 3001
            subset: v2
          weight: 10
