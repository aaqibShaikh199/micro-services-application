apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: legs
  namespace: robot
spec:
  hosts:
    - legs.robot.local
    - legs
    - legs.robot.svc.cluster.local
  gateways:
    - robot-gateway
    - mesh
  http:
    - name: safe-retries
      match:
        - method:
            exact: GET
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: gateway-error,connect-failure,refused-stream
      route:
        - destination:
            host: legs.robot.svc.cluster.local
            port:
              number: 3001
    - name: mutations
      timeout: 3s
      route:
        - destination:
            host: legs.robot.svc.cluster.local
            port:
              number: 3001

