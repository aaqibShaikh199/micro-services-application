apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: robot-gateway
  namespace: robot
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - legs.robot.local
        - hands.robot.local
        - stomach.robot.local
        - eyes.robot.local
        - head.robot.local
