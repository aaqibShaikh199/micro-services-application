apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: robot-legs
  namespace: argocd
spec:
  project: robot
  source:
    repoURL: https://github.com/REPLACE_ORG/robot-microservices.git
    targetRevision: HEAD
    path: one
  destination:
    server: https://kubernetes.default.svc
    namespace: robot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
